[project]
name = "mem0-server"
version = "1.0.0"
description = "Self-hosted mem0 memory server exposing REST and Streamable HTTP MCP from one process."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
